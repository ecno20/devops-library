name: Java Standard CI/CD

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '17'
# Declaramos el input para que sea aceptado desde el caller
      version:
        required: false
        type: string
        default: ''
  workflow_dispatch: # Permite la ejecución manual
    inputs:
      version:
        description: 'Tag de la versión a la que se desea volver (ej: v1.0.1)'
        required: true
        type: string     
# Se añaden los permisos a nivel de raíz (antes de 'jobs:')
permissions:
  #contents: read # <--- Se deja comentado para seguimiento previo a generación de Tags
  contents: write # <--- Requerido para crear etiquetas y releases
  checks: write      # <--- Este permite crear el reporte visual
  pull-requests: write # Permite comentar en el PR
  packages: write # <--- NUEVA LÍNEA: Requerido para subir imágenes a GHCR     

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ☕
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      # NUEVO PASO: Ejecución de pruebas unitarias << pruebas unitarias
      - name: Run Unit Tests 📋
        run: mvn test
        continue-on-error: true # NUEVO PASO: Permitimos que siga para subir el reporte (true/false)

      - name: Publish Test Report 📈
        uses: scacap/action-surefire-report@v1
        if: always() # Esto asegura que el reporte se cree aunque el test falle
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'  

      - name: Build with Maven 🏗️
        run: mvn clean package -DskipTests
#El pipeline se detendrá inmediatamente antes de intentar desplegar        
      - name: Log Audit and Pattern Matching 🔍
        run: |
          echo "Analizando la salida de los logs en busca de errores críticos..."
          # Simulación de escaneo de patrones de error comunes en Java
          if grep -qE "Exception|Error|FATAL" target/surefire-reports/*.txt; then
            echo "🚨 Se detectaron patrones de error críticos en los reportes de ejecución."
            exit 1
          else
            echo "Logs limpios y validados con éxito. Transición segura. ✅"
          fi  
#Fin de la actualización

      # Guardar el archivo .jar generado
      - name: Upload Build Artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: java-app-package
          path: target/*.jar  # Maven guarda el resultado aquí
          retention-days: 1   # Solo lo necesitamos para el flujo actual          

  deploy-to-qa:
    needs: build-and-scan
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Build Artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: java-app-package
          
      - name: Verify Artifact 🔍
        run: ls -R  # Verificamos que el .jar esté presente
        
      # ... (aquí se continua los pasos de echo actuales)
      - name: Deploy to GCP QA 🧪
        run: |
          echo "Conectando al proyecto: ${{ vars.GCP_PROJECT_ID }}"
          echo "Desplegando en QA..."

  deploy-to-prod:
    needs: build-and-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Build Artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: java-app-package
          
      - name: Verify Artifact 🔍
        run: ls -R  # Verificamos que el .jar esté presente
        
      # ... (aquí se continua los pasos de echo actuales) 
      - name: Deploy to GCP PROD 🚀
        run: |
          echo "Conectando al proyecto: ${{ vars.GCP_PROJECT_ID }}"
          echo "Desplegando en Producción..."
  create-tag:
    needs: deploy-to-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs: # <--- NUEVA LÍNEA 18-07-2026
      new_tag: ${{ steps.tag_logic.outputs.new_tag }} # <--- NUEVA LÍNEA: Exporta el tag al pipeline 18-07-2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para ver tags anteriores
# Primer paso para la creación de Relase: Descargamos el artefacto que compilamos al inicio
      - name: Download Artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: java-app-package
# Paso 2 (Actualizado). Lógica de incremento, limpieza y busqueda de tag más alto          
      - name: Sync and Generate Tag 🏷️
        id: tag_logic
        run: |
          # 1. Limpieza de etiquetas huérfanas (Enfoque 2)
          git fetch --prune --tags --force
          
          # 2. Buscar el tag más alto en el servidor (Enfoque 1)
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
          
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          
          # 3. Incrementar parche
          VERSION_PARTS=(${LATEST_TAG//./ })
          PATCH=$((VERSION_PARTS[2] + 1))
          NEW_TAG="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$PATCH"
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT    
# Paso 3. (NUEVO): Crear la Release de GitHub y adjuntar el .jar            
      - name: Create GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_logic.outputs.new_tag }}
          name: Release ${{ steps.tag_logic.outputs.new_tag }}
          files: "*.jar" # Este paso sube todos los archivos .jar encontrados
          draft: false
          prerelease: false       
# Update: 22-09-2026--> Integración de Rollback con container de Docker          
  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso requerido para actualizar tags en GHCR
    steps:
      # 1. Conservamos la descarga del binario .jar clásico de la Release
      - name: Download Specific Release 📦
        uses: robinraju/release-downloader@v1.10
        with:
          tag: ${{ github.event.inputs.version }}
          fileName: "*.jar"

      # 2. Autenticación transparente en GHCR 🐙
      - name: Log in to GHCR 🔑
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Pull de la versión estable y actualización de la etiqueta 'latest' 🔄
      - name: Promote Version to Latest in GHCR 🚀
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          TARGET_TAG="${{ github.event.inputs.version }}"
          
          echo "Iniciando Rollback..."
          echo "Descargando imagen estable: $IMAGE_BASE:$TARGET_TAG"
          docker pull $IMAGE_BASE:$TARGET_TAG
          
          echo "Re-etiquetando $TARGET_TAG como latest..."
          docker tag $IMAGE_BASE:$TARGET_TAG $IMAGE_BASE:latest
          
          echo "Publicando actualización en GHCR..."
          docker push $IMAGE_BASE:latest
          
          echo "Rollback completado con éxito a la versión $TARGET_TAG. ✅"         
  # rollback:
  #   if: github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Download Specific Release 📦
  #       uses: robinraju/release-downloader@v1.10
  #       with:
  #         tag: ${{ github.event.inputs.version }}
  #         fileName: "*.jar"
      
  #     - name: Deploy Rollback Version 🚀
  #       run: |
  #         echo "Iniciando Rollback a la versión ${{ github.event.inputs.version }}"
  #         echo "Desplegando binario recuperado en el entorno de Producción..."
  #         # Próximamente aquí irían los comandos de despliegue en nube        
  #Update->>30-06-2026
  #Update->>18-07-2026 <<se agrega la solución nativa GHCR
#Se añade Job que tomará el .jar y se autenticará en el registro de contenedores y ejecutará la construcción de la imagen
  build-and-push-container:
    needs: [build-and-scan, create-tag]
    # Se ejecuta de forma segura en staging (con el build-and-scan) o en main (cuando create-tag finaliza)
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código del servicio
        uses: actions/checkout@v4

      - name: Descargar el paquete compilado 📥
        uses: actions/download-artifact@v4
        with:
          name: java-app-package
          path: target

      - name: Iniciar sesión en GitHub Container Registry (GHCR) 🐙
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y subir imagen Docker 🐳
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ needs.create-tag.outputs.new_tag || 'staging-latest' }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
# Actualización-->18-10-2026>> se agrega un job que descargará la imagen recién creada desde GHCR y la analizará con Trivy
  security-scan:
    needs: [build-and-push-container, create-tag]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write # Permite publicar hallazgos en la pestaña Security de GitHub
    steps:
      - name: Iniciar sesión en GHCR 🐙
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo de Vulnerabilidades con Trivy 🛡️
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ needs.create-tag.outputs.new_tag || 'staging-latest' }}'
          format: 'table'
          exit-code: '0' # Cambia a '1' para bloquear el pipeline si hay vulnerabilidades CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'        
