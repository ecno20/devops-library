name: Java Standard CI/CD

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '17'
# Declaramos el input para que sea aceptado desde el caller
      version:
        required: false
        type: string
        default: ''
  workflow_dispatch: # Permite la ejecución manual
    inputs:
      version:
        description: 'Tag de la versión a la que se desea volver (ej: v1.0.1)'
        required: true
        type: string     
# Se añaden los permisos a nivel de raíz (antes de 'jobs:')
permissions:
  #contents: read # <--- Se deja comentado para seguimiento previo a generación de Tags
  contents: write # <--- Requerido para crear etiquetas y releases
  checks: write      # <--- Este permite crear el reporte visual
  pull-requests: write # Permite comentar en el PR        

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ☕
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      # NUEVO PASO: Ejecución de pruebas unitarias << pruebas unitarias
      - name: Run Unit Tests 📋
        run: mvn test
        continue-on-error: true # NUEVO PASO: Permitimos que siga para subir el reporte (true/false)

      - name: Publish Test Report 📈
        uses: scacap/action-surefire-report@v1
        if: always() # Esto asegura que el reporte se cree aunque el test falle
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'  

      - name: Build with Maven 🏗️
        run: mvn clean package -DskipTests
#El pipeline se detendrá inmediatamente antes de intentar desplegar        
      - name: Log Audit and Pattern Matching 🔍
        run: |
          echo "Analizando la salida de los logs en busca de errores críticos..."
          # Simulación de escaneo de patrones de error comunes en Java
          if grep -qE "Exception|Error|FATAL" target/surefire-reports/*.txt; then
            echo "🚨 Se detectaron patrones de error críticos en los reportes de ejecución."
            exit 1
          else
            echo "Logs limpios y validados con éxito. Transición segura. ✅"
          fi  
#Fin de la actualización
#Update->>26-06-2026
#Se añade Job que tomará el .jar y se autenticará en el registro de contenedores y 
#ejecutará la construcción de la imagen
      # Guardar el archivo .jar generado
      - name: Upload Build Artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: java-app-package
          path: target/*.jar  # Maven guarda el resultado aquí
          retention-days: 1   # Solo lo necesitamos para el flujo actual          

  deploy-to-qa:
    needs: build-and-scan
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Build Artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: java-app-package
          
      - name: Verify Artifact 🔍
        run: ls -R  # Verificamos que el .jar esté presente
        
      # ... (aquí se continua los pasos de echo actuales)
      - name: Deploy to GCP QA 🧪
        run: |
          echo "Conectando al proyecto: ${{ vars.GCP_PROJECT_ID }}"
          echo "Desplegando en QA..."

  deploy-to-prod:
    needs: build-and-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Build Artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: java-app-package
          
      - name: Verify Artifact 🔍
        run: ls -R  # Verificamos que el .jar esté presente
        
      # ... (aquí se continua los pasos de echo actuales) 
      - name: Deploy to GCP PROD 🚀
        run: |
          echo "Conectando al proyecto: ${{ vars.GCP_PROJECT_ID }}"
          echo "Desplegando en Producción..."
  create-tag:
    needs: deploy-to-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para ver tags anteriores
# Primer paso para la creación de Relase: Descargamos el artefacto que compilamos al inicio
      - name: Download Artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: java-app-package
# Paso 2 (Actualizado). Lógica de incremento, limpieza y busqueda de tag más alto          
      - name: Sync and Generate Tag 🏷️
        id: tag_logic
        run: |
          # 1. Limpieza de etiquetas huérfanas (Enfoque 2)
          git fetch --prune --tags --force
          
          # 2. Buscar el tag más alto en el servidor (Enfoque 1)
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
          
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          
          # 3. Incrementar parche
          VERSION_PARTS=(${LATEST_TAG//./ })
          PATCH=$((VERSION_PARTS[2] + 1))
          NEW_TAG="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$PATCH"
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT    
# Paso 3. (NUEVO): Crear la Release de GitHub y adjuntar el .jar            
      - name: Create GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_logic.outputs.new_tag }}
          name: Release ${{ steps.tag_logic.outputs.new_tag }}
          files: "*.jar" # Este paso sube todos los archivos .jar encontrados
          draft: false
          prerelease: false        
  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Specific Release 📦
        uses: robinraju/release-downloader@v1.10
        with:
          tag: ${{ github.event.inputs.version }}
          fileName: "*.jar"
      
      - name: Deploy Rollback Version 🚀
        run: |
          echo "Iniciando Rollback a la versión ${{ github.event.inputs.version }}"
          echo "Desplegando binario recuperado en el entorno de Producción..."
          # Próximamente aquí irían los comandos de despliegue en nube        